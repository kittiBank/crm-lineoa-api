# Production-style stack for a single AWS EC2 host.
# Postgres lives on RDS — do not start a local postgres service here.
# Object storage uses AWS S3 (credentials via .env from CI secrets).
#
# Usage (on EC2, with a filled .env):
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api worker

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_lineoa_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: 'true'
      # In-compose service hostnames (override localhost from local .env)
      AMQP_URL: ${AMQP_URL:-amqp://crm:changeme@rabbitmq:5672}
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - crm_network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/'+(process.env.API_PREFIX||'api/v1')).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_lineoa_worker
    restart: unless-stopped
    command: ['node', 'dist/worker/main.js']
    env_file:
      - .env
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: 'false'
      AMQP_URL: ${AMQP_URL:-amqp://crm:changeme@rabbitmq:5672}
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - crm_network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: crm_lineoa_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-crm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-changeme}
    # No host ports — only reachable inside crm_network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - crm_network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:

networks:
  crm_network:
    driver: bridge
