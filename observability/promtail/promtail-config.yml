server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: crm-api-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: crm-api
          service: api
          environment: local
          __path__: /var/log/crm/api.log
    pipeline_stages:
      - json:
          expressions:
            context: context
            method: method
            url: url
            statusCode: statusCode
            duration: duration
            level: level
      - labels:
          context:
          level:
